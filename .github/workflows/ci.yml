name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python image library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Shell syntax
        run: |
          for script in mmdvm scripts/*.sh setup.sh; do
            bash -n "$script"
          done
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py oled/oled_display.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: CLI help
        run: |
          ./mmdvm --help
          ./mmdvm onboard --help
          ./mmdvm update --help
          ./scripts/safe-install.sh --help
          ./scripts/state_backup.py --help
      - name: Validate example configuration
        run: python3 scripts/render_configs.py --config config.example.env --check --quiet
      - name: Setup script dry-run
        run: ./setup.sh --dry-run
      - name: x86-style validation (no hardware)
        run: |
          cp config.example.env /tmp/x86.env
          sed -i 's/^MODEM_PORT=.*/MODEM_PORT=\/dev\/ttyUSB0/; s/^ENABLE_OLED=.*/ENABLE_OLED=0/' /tmp/x86.env
          MMDVM_PLATFORM=x86 python3 scripts/render_configs.py --config /tmp/x86.env --check
      - name: Render YSF-only fixture without hardware
        run: |
          cp config.example.env /tmp/fixture.env
          sed -i 's/^MODEM_PORT=.*/MODEM_PORT=\/dev\/null/; s/^ENABLE_OLED=.*/ENABLE_OLED=0/' /tmp/fixture.env
          python3 scripts/render_configs.py --config /tmp/fixture.env --output /tmp/v02-build --quiet
          grep -qx 'UARTPort=/dev/null' /tmp/v02-build/etc/MMDVM-Host.ini
          grep -qx 'UARTSpeed=115200' /tmp/v02-build/etc/MMDVM-Host.ini
          grep -qx 'ENABLE_OLED=0' /tmp/v02-build/etc/system.env
          test ! -e /tmp/v02-build/etc/DMRGateway.ini
          test ! -e /tmp/v02-build/etc/DStarGateway.cfg
      - name: Render DMR + D-Star fixture without hardware
        run: |
          cp config.example.env /tmp/multi.env
          sed -i \
            -e 's/^MODEM_PORT=.*/MODEM_PORT=\/dev\/null/' \
            -e 's/^ENABLE_OLED=.*/ENABLE_OLED=0/' \
            -e 's/^ENABLE_DMR=.*/ENABLE_DMR=1/' \
            -e 's/^DMR_ID=.*/DMR_ID=1234567/' \
            -e 's/^DMR_PASSWORD=.*/DMR_PASSWORD=dummy-pass-123/' \
            -e 's/^ENABLE_DSTAR=.*/ENABLE_DSTAR=1/' \
            -e 's/^DSTAR_REFLECTOR=.*/DSTAR_REFLECTOR=REF001 C/' \
            /tmp/multi.env
          python3 scripts/render_configs.py --config /tmp/multi.env --output /tmp/multi-build --quiet
          grep -qx 'Enable=1' /tmp/multi-build/etc/MMDVM-Host.ini
          grep -qx 'Password=dummy-pass-123' /tmp/multi-build/etc/DMRGateway.ini
          grep -qx 'reflector=REF001 C' /tmp/multi-build/etc/DStarGateway.cfg
          grep -qx 'DMR_ID=1234567' /tmp/multi-build/etc/system.env
          grep -qx 'ENABLE_DSTAR=1' /tmp/multi-build/etc/system.env
      - name: OLED previews for every supported panel
        run: |
          for size in 128x64 128x32 64x48; do
            python3 oled/oled_display.py --preview "/tmp/oled-$size.png" \
              --own-call N0CALL --reflector 46001 --frequency 438.800 \
              --demo-call JA1ABC --size "$size"
            test -s "/tmp/oled-$size.png"
          done
          python3 oled/oled_display.py --preview /tmp/oled-sh1106.png \
            --controller sh1106 --size 128x64 --rotate 180 --demo-call JA1ABC
          test -s /tmp/oled-sh1106.png
          python3 oled/oled_display.py --preview /tmp/oled-idle.png \
            --size 128x32 --own-call N0CALL

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patch curl libmosquitto-dev \
            nlohmann-json3-dev libcurl4-openssl-dev libboost-dev
      - name: Fetch, patch and build upstream (YSF + optional gateways)
        run: ENABLE_DMR=1 ENABLE_DSTAR=1 ./scripts/build.sh
      - name: Show built binaries and D-Star data
        run: |
          ls -lh build/bin
          test -x build/bin/MMDVM-Host
          test -x build/bin/YSFGateway
          test -x build/bin/DMRGateway
          test -x build/bin/dstargateway
          test -f build/share/dstargateway.d/DPlus_Hosts.txt
